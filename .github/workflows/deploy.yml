name: CI/CD Pipeline

on:
  push:
    branches:
      - "**"

jobs:
  audit:
    name: Run security audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Install dependencies
        run: npm install
      - name: Run npm audit
        run: npm audit --audit-level=high || echo "Audit finished with issues"

  tsc:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Install dependencies
        run: npm install
      - name: Run TypeScript check
        run: npx tsc --noEmit

  lint:
    name: Run ESLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Install dependencies
        run: npm install
      - name: Run ESLint
        run: npm run lint

  deploy:
    name: Deploy to Netlify
    runs-on: ubuntu-latest
    needs: [audit, tsc, lint]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies and build project
        run: |
          npm ci
          npm run build
        env:
          VITE_API: ${{ secrets.VITE_API }}

      - name: Install Netlify CLI
        run: npm install -g netlify-cli

      - name: Deploy to Netlify
        run: |
          netlify deploy \
            --dir=dist \
            --auth=${{ secrets.NETLIFY_AUTH_TOKEN }} \
            --site=${{ github.ref == 'refs/heads/main' && secrets.NETLIFY_SITE_ID_PROD || secrets.NETLIFY_SITE_ID_STAGING }} \
            --prod
